# Why a piece left the closet. A fixed list, not free text: 2026-10-13 the retirement notes
# were half unusable — 14 of 27 said only "didn't fit" or nothing, and seven entries for one
# brand were ONE sizing mistake written down seven times, which would have taught the skill to
# stop buying a brand he likes. The user chose to start fresh, so the record starts here,
# structured.
retirement_reasons:
  - doesnt-fit          # the cut or size was wrong — a lesson about that brand, not about him
  - worn-out            # it did its job and wore through
  - redundant           # a duplicate of something better he kept
  - off-palette         # the colour never worked
  - never-wore          # it fit and he still never reached for it — the strongest taste signal
  - style-changed       # he has moved on from it
  - replaced            # a better version of the same thing took its place

lifecycle_states:
  - active              # available to wear and recommend
  - dirty               # worn, needs cleaning before it's wearable again
  - at-cleaner-or-repair
  - packed-away         # seasonal storage
  - lent-out
  - retired             # no longer part of the active wardrobe, kept for history/analytics

condition_ratings:
  - excellent
  - good
  - worn
  - needs-repair

intake_sources:
  - photo
  - receipt
  - manual

# Body & Fit Profile (DESIGN.md Module 2) — fit preference vocabularies.
fit_preference_scales:
  tops: [slim, athletic, classic, relaxed]
  outerwear: [structured, relaxed, cropped, traditional]
  rise: [low, mid, high]
  leg_opening: [skinny, slim, straight, wide]
  length: [cropped, ankle, full-length]
  break: [no-break, slight-break, full-break]

unit_systems:
  - imperial
  - metric

# Shopping Advisor (DESIGN.md Module 6) — purchase-decision log vocabularies.
purchase_recommendations:
  - buy
  - skip
  - already-own

purchase_outcomes:
  - unknown
  - bought
  - skipped

# Purchase Lessons / regret memory (DESIGN.md Module 6) — what kind of
# mistake a past purchase turned out to be, so future recommendations can
# actually avoid repeating it ("I'd avoid slim chinos — you found that cut
# uncomfortable last time") instead of relying on the agent to remember a
# prose note verbatim.
purchase_lesson_types:
  - fit
  - brand
  - color
  - quality
  - lifestyle
  - other

# Care & Maintenance (DESIGN.md Module 8) — watch service intervals depend on
# movement type, not just "watch" as a category (see care_heuristics.yaml).
movement_types:
  - quartz
  - mechanical
  - automatic

# Personal Shopper watchlist (DESIGN.md Module 6) — proactive scanning.
watchlist_sources:
  - user-requested
  - gap-detected

watchlist_statuses:
  - active
  - fulfilled
  - cancelled

# Wardrobe Analytics (DESIGN.md Module 7) — a self-reported usage baseline,
# optionally captured once at intake for a pre-existing item (e.g. during a
# bulk photo-catalog pass of an already-owned wardrobe). wear_count only
# starts counting from the moment an item enters the closet, so without this
# an established item would misreport as "never worn" for months just
# because tracking hasn't caught up yet — this is a hypothesis about past
# usage the user states directly, not something the engine infers.
usage_frequency_estimates:
  - regularly
  - occasionally
  - rarely
  - basically-never

# Digital Closet (DESIGN.md Module 3) — what actually happened to a retired
# item. Only meaningful once lifecycle_state is "retired"; without it,
# "retired" is a dead end with no record of the outcome, even though what
# happened (sold, donated, discarded) is directly relevant to the
# stewardship principle (closet_value.py's recouped-value reporting reads
# this).
disposition_types:
  - donated
  - sold
  - given-away
  - discarded

# Outfit Engine (DESIGN.md Module 5) — a soft compositional tiebreaker, not a
# controlled vocabulary or a filter: colors_match() in closet_report.py
# already handles duplicate/near-duplicate detection on an item's own free-
# text `color` field, which stays free text. This just groups common values
# so the agent can reason about harmony when composing an outfit from real
# candidates (neutrals pair with almost anything; a single non-neutral
# "accent" color usually reads better than two competing saturated colors).
color_families:
  neutral: [white, black, navy, gray, grey, beige, tan, cream, khaki, brown]
  warm: [red, orange, yellow, olive, rust, burgundy, mustard]
  cool: [blue, green, purple, teal]

# Color Analysis (DESIGN.md Module 11) — engine vocabularies for a
# professional seasonal color analysis. The analysis itself (which season,
# which palette) is personal data and lives in profile/color_analysis.yaml;
# these are the reusable enums it's validated against.

# The 12-sub-season system most consultants use. A 4-season analysis still
# maps onto this (e.g. plain "Autumn" -> "True Autumn").
color_seasons:
  - Bright Spring
  - True Spring
  - Light Spring
  - Light Summer
  - True Summer
  - Soft Summer
  - Soft Autumn
  - True Autumn
  - Deep Autumn
  - Deep Winter
  - True Winter
  - Bright Winter

undertones:
  - warm
  - cool
  - neutral
  - olive

# Contrast/intensity the analysis calls for — drives how boldly the Outfit
# Engine combines colors (a Soft season wants low-contrast, tonal pairings; a
# Bright/Deep season can carry stark light/dark).
contrast_levels:
  - low
  - medium
  - high

# color_match.py's verdict for a candidate color checked against the palette.
palette_verdicts:
  - in-palette
  - borderline
  - reject

# Palette hue buckets — how profile/color_analysis.yaml groups its swatches,
# and what color_match.py's --list-family accepts. Distinct from
# color_families above (that's a warm/cool/neutral temperature grouping for
# the generic tiebreaker used when NO color analysis is on file).
palette_families:
  - neutrals
  - reds
  - pinks
  - yellows
  - greens
  - blue-greens
  - blues
  - purples
